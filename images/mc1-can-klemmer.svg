<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="600" rx="18" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#111827">Nærbillede: CAN-klemmerne på MC-1</text>
  <text x="40" y="78" font-size="16" fill="#4b5563">Klemrækken øverst på modulet (INPUTS 27-44, CAN 45-47, ADDRESS, 12V OUT 51-52). Sluk for fyret før du rører noget.</text>

  <!-- module label strip -->
  <rect x="40" y="110" width="1020" height="230" rx="12" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <!-- green plug-in terminal strip -->
  <rect x="60" y="130" width="980" height="70" rx="6" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <g font-size="13" fill="#111827" text-anchor="middle" font-weight="700">
    <text x="105" y="232">42</text><text x="185" y="232">43</text><text x="265" y="232">44</text>
    <text x="400" y="232" font-size="20">45</text><text x="530" y="232" font-size="20">46</text><text x="660" y="232" font-size="20">47</text>
    <text x="900" y="232">51</text><text x="980" y="232">52</text>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="105" y="252">IN11</text><text x="185" y="252">GND</text><text x="265" y="252">IN12</text>
    <text x="400" y="256" font-size="18" font-weight="700" fill="#166534">L</text>
    <text x="530" y="256" font-size="18" font-weight="700" fill="#b45309">H</text>
    <text x="660" y="256" font-size="18" font-weight="700" fill="#111827">GND</text>
    <text x="940" y="252">12V OUT</text>
  </g>
  <text x="530" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">CAN</text>
  <path d="M350 270 H710" stroke="#111827" stroke-width="2"/>
  <!-- address dip -->
  <rect x="740" y="215" width="110" height="34" rx="4" fill="#ffffff" stroke="#6b7280"/>
  <g fill="#1f2937"><rect x="752" y="222" width="14" height="20"/><rect x="776" y="222" width="14" height="20"/><rect x="800" y="222" width="14" height="20"/><rect x="824" y="222" width="14" height="20"/></g>
  <text x="795" y="275" text-anchor="middle" font-size="12" fill="#374151">ADDRESS (T 4 2 1)</text>
  <text x="795" y="292" text-anchor="middle" font-size="11" fill="#6b7280">røres ikke</text>
  <!-- screws -->
  <g stroke="#374151" stroke-width="2">
    <circle cx="105" cy="165" r="17" fill="#d1d5db"/><circle cx="185" cy="165" r="17" fill="#d1d5db"/><circle cx="265" cy="165" r="17" fill="#d1d5db"/>
    <circle cx="400" cy="165" r="22" fill="#f3f4f6" stroke="#111827" stroke-width="3"/>
    <circle cx="530" cy="165" r="22" fill="#f3f4f6" stroke="#111827" stroke-width="3"/>
    <circle cx="660" cy="165" r="22" fill="#f3f4f6" stroke="#111827" stroke-width="3"/>
    <circle cx="900" cy="165" r="17" fill="#d1d5db"/><circle cx="980" cy="165" r="17" fill="#d1d5db"/>
  </g>
  <g stroke="#374151" stroke-width="4" stroke-linecap="round">
    <path d="M95 165 H115"/><path d="M175 165 H195"/><path d="M255 165 H275"/>
    <path d="M388 165 H412"/><path d="M518 165 H542"/><path d="M648 165 H672"/>
    <path d="M890 165 H910"/><path d="M970 165 H990"/>
  </g>
  <!-- 12V forbidden -->
  <path d="M870 135 L1010 200 M1010 135 L870 200" stroke="#dc2626" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  <text x="940" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">Brug IKKE 12V OUT</text>

  <!-- wires going up from terminals: existing (grey) + new (colored) -->
  <g fill="none" stroke-linecap="round">
    <path d="M388 130 C388 100 360 100 340 92" stroke="#9ca3af" stroke-width="7"/>
    <path d="M518 130 C518 100 490 100 470 92" stroke="#9ca3af" stroke-width="7"/>
    <path d="M648 130 C648 100 620 100 600 92" stroke="#9ca3af" stroke-width="7"/>
  </g>
  <text x="300" y="104" text-anchor="end" font-size="12" fill="#6b7280">eksisterende ledninger bliver siddende</text>

  <!-- new wires coming from below -->
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M430 200 V380 C430 420 450 430 470 440" stroke="#16a34a"/>
    <path d="M560 200 V380 C560 410 520 425 490 440" stroke="#f59e0b"/>
    <path d="M690 200 V440" stroke="#111827"/>
  </g>
  <!-- twist hint -->
  <path d="M470 440 C480 460 500 460 480 480 C460 500 480 510 480 530" stroke="#16a34a" stroke-width="7" fill="none"/>
  <path d="M490 440 C470 460 460 465 480 480 C500 495 490 510 490 530" stroke="#f59e0b" stroke-width="7" fill="none"/>
  <text x="510" y="515" font-size="14" fill="#374151">snoet par til SN65HVD230 (CANL / CANH)</text>
  <text x="705" y="430" font-size="14" fill="#374151">3. leder: GND til ESP32 (G)</text>

  <!-- callouts -->
  <rect x="40" y="360" width="330" height="200" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="56" y="388" font-size="16" font-weight="700" fill="#14532d">Sådan gør du</text>
  <g font-size="13" fill="#1f2937">
    <text x="56" y="414">1. Sluk fyret på kontakten / tavlen.</text>
    <text x="56" y="436">2. Løsn kun skrue 45, 46 og 47.</text>
    <text x="56" y="458">3. Stik din nye leder ind ved siden af</text>
    <text x="72" y="476">den gamle i samme klemme.</text>
    <text x="56" y="498">4. Spænd og træk let i begge ledere.</text>
    <text x="56" y="520">5. 45 = CANL, 46 = CANH, 47 = GND.</text>
    <text x="56" y="542">Tip: brug tynde ledere (0,25-0,5 mm²).</text>
  </g>
  <text x="1060" y="580" text-anchor="end" font-size="12" fill="#6b7280">ML-2 lambdamodulet har også en CAN-klemme (L / H / GND), hvis der er bedre plads dér.</text>
</svg>
