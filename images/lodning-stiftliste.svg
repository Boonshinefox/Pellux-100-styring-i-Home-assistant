<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="430" rx="18" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#111827">Lodning: stiftliste i SN65HVD230</text>
  <text x="40" y="78" font-size="16" fill="#4b5563">Det er den eneste lodning i projektet. ESP32'en sættes bare ned i terminal-adapteren.</text>

  <!-- step 1 -->
  <g transform="translate(40 110)">
    <rect width="320" height="290" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <circle cx="34" cy="34" r="18" fill="#111827"/><text x="34" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
    <text x="62" y="40" font-size="16" font-weight="700" fill="#111827">Sæt stiftlisten i</text>
    <rect x="70" y="80" width="180" height="40" rx="4" fill="#111827"/>
    <g fill="#d4af37"><rect x="84" y="60" width="8" height="90"/><rect x="112" y="60" width="8" height="90"/><rect x="140" y="60" width="8" height="90"/><rect x="168" y="60" width="8" height="90"/><rect x="196" y="60" width="8" height="90"/><rect x="224" y="60" width="8" height="90"/></g>
    <rect x="60" y="150" width="200" height="60" rx="6" fill="#1d4ed8"/>
    <text x="160" y="186" text-anchor="middle" font-size="13" fill="#fff">modul, komponentside op</text>
    <text x="20" y="240" font-size="13" fill="#374151">Kort ende ned gennem hullerne.</text>
    <text x="20" y="260" font-size="13" fill="#374151">Hold den lodret med tape eller</text>
    <text x="20" y="278" font-size="13" fill="#374151">sæt den i et breadboard.</text>
  </g>
  <!-- step 2 -->
  <g transform="translate(390 110)">
    <rect width="320" height="290" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <circle cx="34" cy="34" r="18" fill="#111827"/><text x="34" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
    <text x="62" y="40" font-size="16" font-weight="700" fill="#111827">Lod ét ben ad gangen</text>
    <rect x="40" y="150" width="240" height="14" fill="#1d4ed8"/>
    <rect x="152" y="110" width="12" height="90" fill="#d4af37"/>
    <path d="M140 150 Q158 120 176 150 Z" fill="#c0c0c0" stroke="#6b7280"/>
    <path d="M250 70 L178 132" stroke="#6b7280" stroke-width="12" stroke-linecap="round"/>
    <path d="M178 132 L170 140" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <path d="M90 80 L150 132" stroke="#9ca3af" stroke-width="4"/>
    <text x="60" y="76" font-size="12" fill="#374151">tin</text>
    <text x="305" y="64" text-anchor="end" font-size="12" fill="#374151">loddekolbe ca. 330 °C</text>
    <text x="20" y="240" font-size="13" fill="#374151">Varm ben og ring 2 sek., før tin.</text>
    <text x="20" y="260" font-size="13" fill="#374151">Lod først ét ben, ret listen op,</text>
    <text x="20" y="278" font-size="13" fill="#374151">og lod så de andre fem.</text>
  </g>
  <!-- step 3 -->
  <g transform="translate(740 110)">
    <rect width="320" height="290" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <circle cx="34" cy="34" r="18" fill="#111827"/><text x="34" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
    <text x="62" y="40" font-size="16" font-weight="700" fill="#111827">Tjek samlingerne</text>
    <g transform="translate(40 80)">
      <rect x="0" y="60" width="100" height="12" fill="#1d4ed8"/><rect x="44" y="20" width="12" height="80" fill="#d4af37"/>
      <path d="M26 60 Q50 30 74 60 Z" fill="#c0c0c0" stroke="#6b7280"/>
      <text x="50" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">God: blank kegle</text>
      <rect x="140" y="60" width="100" height="12" fill="#1d4ed8"/><rect x="184" y="20" width="12" height="80" fill="#d4af37"/>
      <circle cx="190" cy="48" r="18" fill="#a3a3a3" stroke="#6b7280"/>
      <text x="190" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Dårlig: kugle</text>
    </g>
    <text x="20" y="240" font-size="13" fill="#374151">Ingen tin-broer mellem benene.</text>
    <text x="20" y="260" font-size="13" fill="#374151">Alternativ: lod 6 ledninger direkte</text>
    <text x="20" y="278" font-size="13" fill="#374151">i hullerne i stedet for stiftliste.</text>
  </g>
</svg>
