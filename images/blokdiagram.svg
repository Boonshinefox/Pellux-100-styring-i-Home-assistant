<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#374151"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#111827">Sådan hænger det sammen</text>
  <text x="40" y="78" font-size="16" fill="#4b5563">ESP32'en lytter bare med på fyrets CAN-bus og sender værdierne videre til Home Assistant over WiFi.</text>

  <!-- boiler frame -->
  <rect x="30" y="105" width="560" height="380" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="50" y="135" font-size="17" font-weight="700" fill="#9a3412">NIBE / Vølund Pellux 100 (Estyma-styring)</text>

  <!-- CAN bus line -->
  <path d="M60 300 H560" stroke="#f59e0b" stroke-width="7"/>
  <path d="M60 318 H560" stroke="#16a34a" stroke-width="7"/>
  <text x="70" y="350" font-size="14" fill="#374151" font-weight="700">CAN-bus 125 kbit/s · H / L / GND</text>
  <text x="70" y="370" font-size="13" fill="#6b7280">CANopen-lignende, ca. 260 beskeder i sekundet</text>

  <!-- devices -->
  <g>
    <rect x="60" y="160" width="150" height="90" rx="10" fill="#1f2937"/>
    <rect x="80" y="175" width="110" height="45" rx="4" fill="#d9f99d"/>
    <text x="135" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">65,2 °C</text>
    <text x="135" y="240" text-anchor="middle" font-size="13" fill="#e5e7eb">Betjeningspanel</text>
    <path d="M135 250 V300" stroke="#374151" stroke-width="3"/>
  </g>
  <g>
    <rect x="240" y="160" width="150" height="90" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <text x="315" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">MC-1</text>
    <text x="315" y="216" text-anchor="middle" font-size="12" fill="#374151">hovedmodul CAN I/O</text>
    <text x="315" y="234" text-anchor="middle" font-size="12" fill="#374151">følere, pumper, snegl</text>
    <path d="M315 250 V300" stroke="#374151" stroke-width="3"/>
  </g>
  <g>
    <rect x="420" y="160" width="150" height="90" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <text x="495" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">ML-2</text>
    <text x="495" y="216" text-anchor="middle" font-size="12" fill="#374151">lambdamodul</text>
    <text x="495" y="234" text-anchor="middle" font-size="12" fill="#374151">(iltmåling)</text>
    <path d="M495 250 V300" stroke="#374151" stroke-width="3"/>
  </g>
  <!-- tap -->
  <circle cx="420" cy="309" r="9" fill="#111827"/>
  <path d="M420 318 V430 H640" fill="none" stroke="#111827" stroke-width="3"/>
  <text x="300" y="458" font-size="13" fill="#111827" font-weight="700">klemme 45 / 46 / 47 på MC-1</text>

  <!-- transceiver -->
  <rect x="640" y="390" width="160" height="80" rx="10" fill="#1d4ed8"/>
  <text x="720" y="425" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">SN65HVD230</text>
  <text x="720" y="447" text-anchor="middle" font-size="12" fill="#dbeafe">CAN-transceiver, 3,3 V</text>
  <path d="M800 430 H850" stroke="#374151" stroke-width="3" marker-end="url(#ar)"/>
  <text x="808" y="420" font-size="11" fill="#374151">RX/TX</text>

  <!-- esp -->
  <rect x="855" y="380" width="170" height="100" rx="10" fill="#111827"/>
  <text x="940" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ESP32-S3</text>
  <text x="940" y="440" text-anchor="middle" font-size="12" fill="#d1d5db">ESPHome</text>
  <text x="940" y="460" text-anchor="middle" font-size="12" fill="#fde68a" font-weight="700">LISTENONLY</text>

  <!-- wifi -->
  <path d="M940 380 V250" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arb)"/>
  <text x="952" y="320" font-size="13" fill="#2563eb" font-weight="700">WiFi (ESPHome API)</text>

  <!-- HA -->
  <rect x="830" y="120" width="330" height="125" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="995" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Home Assistant</text>
  <text x="850" y="180" font-size="13" fill="#1f2937">• Kedel, varmt vand, fremløb, ude</text>
  <text x="850" y="200" font-size="13" fill="#1f2937">• Blæser, flamme, snegl</text>
  <text x="850" y="220" font-size="13" fill="#1f2937">• Pilletæller, varmtvandsprioritet, varmetab</text>
  <text x="850" y="238" font-size="13" fill="#1f2937">• Dashboard og beskeder på telefonen</text>

  <!-- one-way note -->
  <rect x="610" y="120" width="190" height="110" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="705" y="148" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Kun læsning</text>
  <text x="705" y="170" text-anchor="middle" font-size="12" fill="#7f1d1d">ESP'en sender intet</text>
  <text x="705" y="187" text-anchor="middle" font-size="12" fill="#7f1d1d">og kvitterer ikke (ACK)</text>
  <text x="705" y="204" text-anchor="middle" font-size="12" fill="#7f1d1d">så den kan ikke</text>
  <text x="705" y="221" text-anchor="middle" font-size="12" fill="#7f1d1d">forstyrre fyret</text>
</svg>
