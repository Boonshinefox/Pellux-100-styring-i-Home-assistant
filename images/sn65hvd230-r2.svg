<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="560" rx="18" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#111827">Fjern R2 (120 Ω) på SN65HVD230-modulet</text>
  <text x="40" y="78" font-size="16" fill="#4b5563">Fyrets CAN-bus er allerede termineret. En ekstra 120 Ω trækker bussen længere ned og kan give fejl.</text>

  <!-- board -->
  <g transform="translate(60 110)">
    <rect width="380" height="400" rx="16" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="4"/>
    <g fill="#fbbf24" stroke="#78350f" stroke-width="3">
      <circle cx="40" cy="60" r="14"/><circle cx="40" cy="120" r="14"/><circle cx="40" cy="180" r="14"/>
      <circle cx="40" cy="240" r="14"/><circle cx="40" cy="300" r="14"/><circle cx="40" cy="360" r="14"/>
    </g>
    <g fill="#ffffff" font-size="26" font-weight="700">
      <text x="66" y="69">3V3</text><text x="66" y="129">GND</text><text x="66" y="189">CTX</text>
      <text x="66" y="249">CRX</text><text x="66" y="309">CANH</text><text x="66" y="369">CANL</text>
    </g>
    <!-- chip -->
    <rect x="215" y="150" width="90" height="100" rx="6" fill="#111827"/>
    <g fill="#d1d5db"><rect x="200" y="160" width="15" height="10"/><rect x="200" y="185" width="15" height="10"/><rect x="200" y="210" width="15" height="10"/><rect x="200" y="235" width="15" height="10"/>
    <rect x="305" y="160" width="15" height="10"/><rect x="305" y="185" width="15" height="10"/><rect x="305" y="210" width="15" height="10"/><rect x="305" y="235" width="15" height="10"/></g>
    <!-- R1 -->
    <rect x="200" y="45" width="22" height="50" rx="3" fill="#111827" stroke="#9ca3af"/>
    <text x="230" y="78" font-size="20" fill="#ffffff">R1</text>
    <!-- R2 -->
    <rect x="200" y="290" width="22" height="50" rx="3" fill="#111827" stroke="#9ca3af"/>
    <text x="230" y="323" font-size="20" fill="#ffffff">R2</text>
    <circle cx="211" cy="315" r="44" fill="none" stroke="#ef4444" stroke-width="6"/>
    <!-- mount holes -->
    <circle cx="320" cy="70" r="30" fill="#ffffff" stroke="#e5e7eb" stroke-width="8"/>
    <circle cx="320" cy="335" r="30" fill="#ffffff" stroke="#e5e7eb" stroke-width="8"/>
  </g>
  

  <!-- explanation -->
  <g transform="translate(520 110)">
    <rect width="540" height="200" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="20" y="34" font-size="18" font-weight="700" fill="#991b1b">Hvorfor?</text>
    <g font-size="14" fill="#1f2937">
      <text x="20" y="62">R2 er en 120 Ω modstand mellem CANH og CANL (terminering).</text>
      <text x="20" y="86">Med fyret slukket målte vi ca. 41 Ω mellem MC-1 klemme 45 og 46.</text>
      <text x="20" y="110">Det svarer til tre 120 Ω i parallel: 120 / 3 = 40 Ω.</text>
      <text x="20" y="134">Med R2 på ville det blive 120 / 4 = 30 Ω, endnu lavere end</text>
      <text x="20" y="158">CAN-standardens 60 Ω. Derfor fjernes R2 på modulet,</text>
      <text x="20" y="182">og fyrets egne termineringer bliver hvor de er.</text>
    </g>
  </g>
  <g transform="translate(520 330)">
    <rect width="540" height="200" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="20" y="34" font-size="18" font-weight="700" fill="#14532d">Sådan</text>
    <g font-size="14" fill="#1f2937">
      <text x="20" y="62">1. Mål først selv: fyret SLUKKET, multimeter på Ω mellem 45 og 46.</text>
      <text x="40" y="84">ca. 40 Ω → fjern R2.   ca. 60 Ω → lad R2 sidde.</text>
      <text x="20" y="110">2. Varm R2 med loddekolben og skub den af (eller klip den over</text>
      <text x="40" y="132">med en lille sidebider). Pas på ikke at ramme nabosporene.</text>
      <text x="20" y="158">3. Kontrol: modulet alene skal måle meget højt mellem CANH og CANL,</text>
      <text x="40" y="180">og bussen skal stadig måle ca. 41 Ω med modulet koblet på.</text>
    </g>
  </g>
</svg>
