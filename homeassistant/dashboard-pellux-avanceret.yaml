    - input_number.pillefyr_kilo_pr_saek
    custom_fields:
      body: |
        [[[
        const p=n=>n+'px';
        const g=id=>(states[id]?parseFloat(states[id].state):NaN);
        const f=(x,d)=>isNaN(x)?'--':x.toLocaleString('da-DK',{minimumFractionDigits:d,maximumFractionDigits:d});
        const KPS=g('input_number.pillefyr_kilo_pr_saek')||15;
        const CAP=variables.beholder_kg;
        const kg=g('sensor.pillefyr_beholdning_beregnet');
        const pct=isNaN(kg)?0:Math.max(0,Math.min(100,kg/CAP*100));
        const n=g('counter.pillefyr_saekke_fyldt_pa')||0;
        const ld=states['input_datetime.pillefyr_sidst_fyldt'];
        const lt=ld&&ld.attributes.timestamp?new Date(ld.attributes.timestamp*1000):null;
        const nu=lt&&(Date.now()-lt)<2*3600e3&&n>0;
        const ss=x=>x===1?'1 sæk':x+' sække';
        let col='#a3e635'; if(isNaN(kg))col='#94a3b8'; else if(kg<15)col='#f87171'; else if(kg<45)col='#fbbf24';
        const fyld=nu?`<div style='background:rgba(163,230,53,.14);border:1px solid rgba(163,230,53,.45);border-radius:${p(12)};padding:${p(8)} ${p(12)};display:flex;align-items:center;justify-content:space-between;gap:${p(8)};'><span style='font-size:${p(14)};color:rgba(255,255,255,.8);'>Fyldt på nu</span><span style='font-size:${p(24)};font-weight:800;color:#a3e635;white-space:nowrap;'>${ss(n)}</span></div>`
         :`<div style='font-size:${p(13)};color:rgba(255,255,255,.55);'>${lt&&n>0?'Sidst fyldt '+lt.toLocaleDateString('da-DK',{day:'numeric',month:'short'})+' kl. '+lt.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})+' · '+ss(n):'Tryk +1 sæk for hver sæk du hælder i'}</div>`;
        return `<div style='display:flex;flex-direction:column;gap:${p(8)};'>
        <div style='display:flex;align-items:center;justify-content:space-between;'><div style='display:flex;align-items:center;gap:${p(8)};'><ha-icon icon='mdi:grain' style='--mdc-icon-size:${p(22)};width:${p(22)};height:${p(22)};color:#fbbf24;'></ha-icon><span style='font-size:${p(18)};font-weight:700;color:white;'>Piller</span></div><span style='font-size:${p(12)};color:rgba(255,255,255,.5);'>beregnet ud fra sneglen</span></div>
        <div style='display:flex;align-items:baseline;gap:${p(10)};'><span style='font-size:${p(40)};font-weight:800;color:white;line-height:1;'>${isNaN(kg)?'--':f(kg,0)+' kg'}</span><span style='font-size:${p(16)};font-weight:700;color:${col};'>ca. ${f(kg/KPS,1)} sække</span></div>
        <div style='height:${p(8)};background:rgba(255,255,255,.10);border-radius:999px;overflow:hidden;'><div style='width:${pct}%;height:100%;background:linear-gradient(90deg,#facc15,#f59e0b);'></div></div>
        ${fyld}</div>`;
        ]]]
