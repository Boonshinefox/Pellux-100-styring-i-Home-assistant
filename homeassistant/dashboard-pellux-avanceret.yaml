        <div style='display:flex;flex-wrap:wrap;align-items:baseline;gap:${p(8)};'><span style='font-size:${p(46)};font-weight:800;color:${tc(t)};line-height:1;'>${f(t,1)}°</span>${states['binary_sensor.pellux_varmtvandsprioritet']&&states['binary_sensor.pellux_varmtvandsprioritet'].state==='on'?`<span style='display:inline-flex;align-items:center;gap:${p(4)};padding:${p(3)} ${p(10)};border-radius:999px;background:#f9731622;border:1px solid #f9731666;color:#fb923c;font-size:${p(13)};font-weight:700;white-space:nowrap;'><ha-icon icon='mdi:water-boiler' style='--mdc-icon-size:${p(15)};width:${p(15)};height:${p(15)};'></ha-icon>Opvarmes</span>`:`<span style='font-size:${p(13)};color:rgba(255,255,255,.55);'>mål ${MAAL}°</span>`}</div>
        <div style='position:relative;height:${p(8)};background:rgba(255,255,255,.10);border-radius:999px;'><div style='width:${pct}%;height:100%;border-radius:999px;background:linear-gradient(90deg,#38bdf8,${tc(t)});'></div><div style='position:absolute;top:-3px;bottom:-3px;left:${gp}%;width:2px;background:white;opacity:.8;'></div></div></div>`;
        ]]]
      graph:
        card:
          type: custom:apexcharts-card
          graph_span: 12h
          header:
            show: false
          card_mod: *id002
          apex_config:
            chart:
              height: 90
              sparkline:
                enabled: true
