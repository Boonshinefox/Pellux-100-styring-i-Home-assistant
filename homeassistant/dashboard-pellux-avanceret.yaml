    - sensor.pellux_sniffer_udetemperatur
    - sensor.pellux_sniffer_blaeser
    - sensor.pellux_sniffer_flamme
    - sensor.pellux_sniffer_taender_ra
    - binary_sensor.pellux_sniffer_snegl_fremforing
    - sensor.pillefyr_beholdning_beregnet
    custom_fields:
      body: |
        [[[
        const p=n=>n+'px';
        const g=id=>(states[id]?parseFloat(states[id].state):NaN);
        const f=(x,d)=>isNaN(x)?'--':x.toLocaleString('da-DK',{minimumFractionDigits:d,maximumFractionDigits:d});
        const tc=t=>isNaN(t)?'#64748b':t<30?'#38bdf8':t<45?'#22d3ee':t<55?'#facc15':t<68?'#f59e0b':'#ef4444';
        const K=g('sensor.pellux_sniffer_kedeltemperatur'),VV=g('sensor.pellux_sniffer_varmt_vand'),KF=g('sensor.pellux_sniffer_kreds_1_fremlob'),UD=g('sensor.pellux_sniffer_udetemperatur');
        const BL=g('sensor.pellux_sniffer_blaeser'),FL=g('sensor.pellux_sniffer_flamme'),IG=g('sensor.pellux_sniffer_taender_ra');
        const SN=states['binary_sensor.pellux_sniffer_snegl_fremforing']&&states['binary_sensor.pellux_sniffer_snegl_fremforing'].state==='on';
        const st=(()=>{
          if(isNaN(FL)&&isNaN(BL)) return {t:'Offline',c:'#64748b',ic:'mdi:lan-disconnect'};
          if(IG>200) return {t:'Tænder',c:'#f97316',ic:'mdi:fire-alert'};
          if(FL>50) return {t:'Brænder',c:'#f59e0b',ic:'mdi:fire'};
          if(BL>=90) return {t:'Udluftning',c:'#38bdf8',ic:'mdi:fan'};
          if(BL>0) return {t:'Starter / slukker',c:'#38bdf8',ic:'mdi:fan-clock'};
          return {t:'Stop',c:'#94a3b8',ic:'mdi:fire-off'};
        })();
        const kg=g('sensor.pillefyr_beholdning_beregnet'), CAP=variables.beholder_kg, lvl=kg/CAP*100;
        const row=(ic,icc,l,v)=>`<div style='display:flex;align-items:center;justify-content:space-between;gap:${p(8)};padding:${p(7)} 0;border-bottom:1px solid rgba(255,255,255,.06);'><div style='display:flex;align-items:center;gap:${p(8)};min-width:0;'><ha-icon icon='${ic}' style='--mdc-icon-size:${p(18)};width:${p(18)};height:${p(18)};color:${icc};flex:none;'></ha-icon><span style='font-size:${p(14)};color:rgba(255,255,255,.7);white-space:nowrap;'>${l}</span></div><span style='font-size:${p(15)};font-weight:700;color:white;white-space:nowrap;'>${v}</span></div>`;
        const pct=isNaN(lvl)?0:Math.max(0,Math.min(100,lvl));
        return `<div style='display:flex;flex-direction:column;gap:${p(4)};'>
        <div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:${p(4)};'><div style='display:flex;align-items:center;gap:${p(8)};'><ha-icon icon='mdi:clipboard-pulse-outline' style='--mdc-icon-size:${p(22)};width:${p(22)};height:${p(22)};color:#a3e635;'></ha-icon><span style='font-size:${p(18)};font-weight:700;color:white;'>Drift</span></div><span style='font-size:${p(14)};font-weight:700;color:${st.c};'>${st.t}</span></div>
        ${row('mdi:fire','#f59e0b','Flamme',isNaN(FL)?'--':f(FL,0))}${row('mdi:fan','#38bdf8','Blæser',f(BL,0)+' %')}${row('mdi:screw-lag','#a3e635','Snegl',SN?'kører':'stille')}${row('mdi:home-thermometer-outline','#94a3b8','Ude',f(UD,1)+' °C')}${row('mdi:grain','#fbbf24','Piller',isNaN(kg)?'--':f(kg,0)+' kg')}
        <div style='height:${p(8)};background:rgba(255,255,255,.10);border-radius:999px;overflow:hidden;margin-top:${p(6)};'><div style='width:${pct}%;height:100%;background:linear-gradient(90deg,#facc15,#f59e0b);'></div></div>
        <div style='font-size:${p(12)};color:rgba(255,255,255,.5);'>Pillebeholdning ${isNaN(lvl)?'--':Math.round(lvl)+' %'}</div></div>`;
        ]]]
